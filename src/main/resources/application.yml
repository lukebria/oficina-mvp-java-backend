server:
  port: ${APP_PORT:3000}

spring:
  application:
    name: oficina-mvp-backend
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:oficina_mvp}
    username: ${DB_USER:oficina}
    password: ${DB_PASSWORD:oficina}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
        format_sql: true
  flyway:
    enabled: true
    locations: classpath:db/migration
  mail:
    host: ${MAIL_HOST:smtp.gmail.com}
    port: ${MAIL_PORT:587}
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  # /actuator/health/liveness e /readiness (usados pelas probes do k8s/app.yaml, plano 14). O Spring liga isso
  # sozinho quando detecta o Kubernetes; habilitar explicitamente garante os mesmos endpoints local e nos testes.
  endpoint:
    health:
      probes:
        enabled: true
  # Observabilidade (Fase 3, planos 05 e 13) - traces e métricas exportados via OTLP para o New Relic (aceita
  # OTLP nativamente). Nomes de propriedade do Spring Boot 4 (auto-configuração via spring-boot-starter-opentelemetry).
  # Tudo inerte por padrão: sampling 0 (nenhum trace é criado) e export de métricas desligado (nenhuma chamada de
  # rede) - liga com TRACING_SAMPLING_PROBABILITY/OTLP_METRICS_EXPORT_ENABLED + endpoint + License Key, configurados
  # pelo pipeline. Uma vez ativo, os logs (ver "logging" abaixo) ganham trace.id/span.id automaticamente.
  tracing:
    sampling:
      probability: ${TRACING_SAMPLING_PROBABILITY:0}
  opentelemetry:
    # Nome do serviço no New Relic (o mesmo usado nos dashboards/alertas de docs/observability).
    resource-attributes:
      service.name: oficina-mvp-backend
    tracing:
      export:
        otlp:
          endpoint: ${NEW_RELIC_OTLP_ENDPOINT:http://localhost:4318/v1/traces}
          headers:
            api-key: ${NEW_RELIC_LICENSE_KEY:}
  otlp:
    # Métricas de negócio (BusinessMetrics: service_order.created, service_order.status.duration,
    # integration.failure). "enabled: false" por padrão é uma trava extra além do endpoint em localhost.
    metrics:
      export:
        enabled: ${OTLP_METRICS_EXPORT_ENABLED:false}
        url: ${NEW_RELIC_OTLP_METRICS_ENDPOINT:http://localhost:4318/v1/metrics}
        headers:
          api-key: ${NEW_RELIC_LICENSE_KEY:}
    # Logs NÃO vão por OTLP: já chegam ao New Relic pelo agente do cluster (nri-bundle); duplicar gastaria a cota.
    logging:
      export:
        enabled: false

# Logging estruturado em JSON (Elastic Common Schema) - inclui trace.id/span.id automaticamente quando o
# tracing acima estiver ativo, permitindo correlacionar logs entre requisições/serviços.
logging:
  structured:
    format:
      console: ecs
    # O Micrometer grava o contexto do trace no MDC como traceId/spanId; o New Relic liga log -> trace pelo atributo
    # trace.id (e span.id). Renomear aqui faz o "logs in context" funcionar e casa com o widget de logs do dashboard.
    json:
      rename:
        traceId: trace.id
        spanId: span.id

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html

app:
  jwt:
    secret: ${JWT_SECRET:troque-este-segredo-em-producao-com-pelo-menos-32-caracteres}
    expires-in-minutes: ${JWT_EXPIRES_IN_MINUTES:480}
    customer-secret: ${CUSTOMER_JWT_SECRET:troque-este-segredo-de-cliente-em-producao-com-pelo-menos-32-caracteres}
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://localhost:3000}
  seed:
    admin-email: ${SEED_ADMIN_EMAIL:admin@oficina.com}
    admin-password: ${SEED_ADMIN_PASSWORD:Admin@123}
  mail:
    from: ${MAIL_FROM:${MAIL_USERNAME:no-reply@oficina.com}}
  internal:
    api-key: ${INTERNAL_API_KEY:troque-esta-chave-interna-em-producao}
