# yaml-language-server: $schema=https://raw.githubusercontent.com/yannh/kubernetes-json-schema/master/v1.28.0/ingress-networking-v1.json
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: oficina-app-ingress
spec:
  ingressClassName: kong
  rules:
    # ${INGRESS_HOST} é substituído pelo pipeline (homolog.oficina-mvp.local / prod.oficina-mvp.local)
    # conforme o namespace de destino - necessário porque os dois ambientes rodam no mesmo cluster/Kong
    # e um Ingress sem host, em path "/", colidiria entre namespaces diferentes.
    - host: ${INGRESS_HOST}
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: oficina-app-service
                port:
                  number: 80
