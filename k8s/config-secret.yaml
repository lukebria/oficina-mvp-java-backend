apiVersion: v1
kind: ConfigMap
metadata:
  name: app-config
data:
  APP_PORT: "3000"
  # Endpoint do RDS (oficina-mvp-infra-db): o pipeline substitui ${DB_HOST} pela variable DB_HOST do GitHub.
  DB_HOST: "${DB_HOST}"
  DB_PORT: "5432"
  DB_NAME: "oficina_mvp"
  JWT_EXPIRES_IN_MINUTES: "30"
  CORS_ALLOWED_ORIGINS: "http://localhost:5173,http://localhost:3000"
  SEED_ADMIN_EMAIL: "admin@oficina.com"
  MAIL_USERNAME: "${MAIL_USERNAME}"
  MAIL_FROM: "${MAIL_FROM}"
  MAIL_HOST: "${MAIL_HOST}"
  MAIL_PORT: "${MAIL_PORT}"
  # Observabilidade (plano 05) - valores vêm de GitHub Variables; o pipeline aplica defaults inertes (sampling 0,
  # export de métricas desligado, endpoints localhost) quando não configuradas.
  NEW_RELIC_OTLP_ENDPOINT: "${NEW_RELIC_OTLP_ENDPOINT}"
  NEW_RELIC_OTLP_METRICS_ENDPOINT: "${NEW_RELIC_OTLP_METRICS_ENDPOINT}"
  TRACING_SAMPLING_PROBABILITY: "${TRACING_SAMPLING_PROBABILITY}"
  OTLP_METRICS_EXPORT_ENABLED: "${OTLP_METRICS_EXPORT_ENABLED}"
---
apiVersion: v1
kind: Secret
metadata:
  name: app-secrets
type: Opaque
stringData:
  DB_USER: "oficina"
  DB_PASSWORD: "${DB_PASSWORD}"
  JWT_SECRET: "${JWT_SECRET}"
  CUSTOMER_JWT_SECRET: "${CUSTOMER_JWT_SECRET}"
  INTERNAL_API_KEY: "${INTERNAL_API_KEY}"
  SEED_ADMIN_PASSWORD: "${SEED_ADMIN_PASSWORD}"
  MAIL_PASSWORD: "${MAIL_PASSWORD}"
  NEW_RELIC_LICENSE_KEY: "${NEW_RELIC_LICENSE_KEY}"
