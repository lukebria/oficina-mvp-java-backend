# yaml-language-server: $schema=https://raw.githubusercontent.com/yannh/kubernetes-json-schema/master/v1.28.0/horizontalpodautoscaler-autoscaling-v2.json
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: oficina-app-hpa
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: oficina-app-deployment
  minReplicas: 1
  maxReplicas: 5
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 20
  # Plano 14 (validado em 12/10): mesmo com a readinessProbe, logo depois de ficar pronto o pod ainda gasta ~50m de
  # CPU (JVM aquecendo) - acima do alvo de 20% de 100m - e o HPA ia a 5 réplicas em todo deploy. Com a janela, só
  # escala se a CPU ficar acima do alvo por 2 min seguidos: o pico da inicialização passa, carga real ainda escala.
  behavior:
    scaleUp:
      stabilizationWindowSeconds: 120
