# yaml-language-server: $schema=https://raw.githubusercontent.com/yannh/kubernetes-json-schema/master/v1.28.0/deployment-apps-v1.json
apiVersion: apps/v1
kind: Deployment
metadata:
  name: oficina-app-deployment
spec:
  replicas: 1
  selector:
    matchLabels:
      app: oficina-app
  template:
    metadata:
      labels:
        app: oficina-app
    spec:
      containers:
        - name: oficina-app
          image: ${ECR_REPOSITORY_URL}:latest
          imagePullPolicy: Always
          ports:
            - containerPort: 3000
          # =========================================================
          # ESSENCIAL PARA O HPA: Solicitação e Limite de Recursos
          # =========================================================
          resources:
            requests:
              cpu: "100m"      # 0.1 de um núcleo de CPU
              memory: "256Mi"  # Memória inicial
            limits:
              cpu: "500m"      # Máximo de 0.5 de CPU
              memory: "512Mi"  # Limite máximo de RAM
          env:
            - name: APP_PORT
              valueFrom:
                configMapKeyRef:
                  name: app-config
                  key: APP_PORT
            - name: DB_HOST
              valueFrom:
                configMapKeyRef:
                  name: app-config
                  key: DB_HOST
            - name: DB_PORT
              valueFrom:
                configMapKeyRef:
                  name: app-config
                  key: DB_PORT
            - name: DB_NAME
              valueFrom:
                configMapKeyRef:
                  name: app-config
                  key: DB_NAME
            - name: DB_USER
              valueFrom:
                secretKeyRef:
                  name: app-secrets
                  key: DB_USER
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: app-secrets
                  key: DB_PASSWORD
            - name: JWT_SECRET
              valueFrom:
                secretKeyRef:
                  name: app-secrets
                  key: JWT_SECRET
            - name: JWT_EXPIRES_IN_MINUTES
              valueFrom:
                configMapKeyRef:
                  name: app-config
                  key: JWT_EXPIRES_IN_MINUTES
            - name: CORS_ALLOWED_ORIGINS
              valueFrom:
                configMapKeyRef:
                  name: app-config
                  key: CORS_ALLOWED_ORIGINS
            - name: SEED_ADMIN_EMAIL
              valueFrom:
                configMapKeyRef:
                  name: app-config
                  key: SEED_ADMIN_EMAIL
            - name: SEED_ADMIN_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: app-secrets
                  key: SEED_ADMIN_PASSWORD
            - name: MAIL_USERNAME
              valueFrom:
                configMapKeyRef:
                  name: app-config
                  key: MAIL_USERNAME
            - name: MAIL_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: app-secrets
                  key: MAIL_PASSWORD
            - name: MAIL_FROM
              valueFrom:
                configMapKeyRef:
                  name: app-config
                  key: MAIL_FROM
---
# yaml-language-server: $schema=https://raw.githubusercontent.com/yannh/kubernetes-json-schema/master/v1.28.0/service-v1.json
apiVersion: v1
kind: Service
metadata:
  name: oficina-app-service
spec:
  selector:
    app: oficina-app
  ports:
    - protocol: TCP
      port: 80
      targetPort: 3000
  type: LoadBalancer
