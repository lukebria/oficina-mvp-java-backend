services:
  postgres:
    image: postgres:16-alpine
    container_name: oficina-mvp-postgres
    environment:
      POSTGRES_DB: ${DB_NAME:-oficina_mvp}
      POSTGRES_USER: ${DB_USER:-oficina}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-oficina}
    ports:
      - "5432:5432"
    volumes:
      - oficina_pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-oficina} -d ${DB_NAME:-oficina_mvp}"]
      interval: 10s
      timeout: 5s
      retries: 5

  api:
    build: .
    container_name: oficina-mvp-api
    depends_on:
      postgres:
        condition: service_healthy
    env_file:
      - .env
    environment:
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: ${DB_NAME:-oficina_mvp}
      DB_USER: ${DB_USER:-oficina}
      DB_PASSWORD: ${DB_PASSWORD:-oficina}
      APP_PORT: ${APP_PORT:-3000}
      JWT_SECRET: ${JWT_SECRET:-troque-este-segredo-em-producao-com-pelo-menos-32-caracteres}
      JWT_EXPIRES_IN_MINUTES: ${JWT_EXPIRES_IN_MINUTES:-480}
      SEED_ADMIN_EMAIL: ${SEED_ADMIN_EMAIL:-admin@oficina.com}
      SEED_ADMIN_PASSWORD: ${SEED_ADMIN_PASSWORD:-Admin@123}
    ports:
      - "3000:3000"

  # Reproduz localmente o mesmo papel do Kong no EKS (ver oficina-mvp-infra-iac):
  # roteia o tráfego para a API em vez de expor a porta 3000 direto.
  kong:
    image: kong:3.7
    container_name: oficina-mvp-kong
    environment:
      KONG_DATABASE: "off"
      KONG_DECLARATIVE_CONFIG: /kong/kong.yml
      KONG_PROXY_LISTEN: "0.0.0.0:8000"
    volumes:
      - ./kong/kong.yml:/kong/kong.yml:ro
    ports:
      - "8000:8000"
    depends_on:
      - api

volumes:
  oficina_pg_data:
