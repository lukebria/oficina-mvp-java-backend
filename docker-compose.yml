services:
  postgres:
    image: postgres:17-alpine
    container_name: oficina-mvp-postgres
    environment:
      POSTGRES_DB: ${DB_NAME:-oficina_mvp}
      POSTGRES_USER: ${DB_USER:-oficina}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-oficina}
    ports:
      - "5432:5432"
    volumes:
      - oficina_pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-oficina} -d ${DB_NAME:-oficina_mvp}"]
      interval: 10s
      timeout: 5s
      retries: 5

  api:
    build: .
    container_name: oficina-mvp-api
    depends_on:
      postgres:
        condition: service_healthy
    env_file:
      - .env
    environment:
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: ${DB_NAME:-oficina_mvp}
      DB_USER: ${DB_USER:-oficina}
      DB_PASSWORD: ${DB_PASSWORD:-oficina}
      APP_PORT: ${APP_PORT:-3000}
      JWT_SECRET: ${JWT_SECRET:-troque-este-segredo-em-producao-com-pelo-menos-32-caracteres}
      JWT_EXPIRES_IN_MINUTES: ${JWT_EXPIRES_IN_MINUTES:-480}
      SEED_ADMIN_EMAIL: ${SEED_ADMIN_EMAIL:-admin@oficina.com}
      SEED_ADMIN_PASSWORD: ${SEED_ADMIN_PASSWORD:-Admin@123}
    ports:
      - "3000:3000"

volumes:
  oficina_pg_data:
