name: PR Validation

on:
  pull_request:
    branches:
      - main
      - develop
      - homolog

jobs:
  # ============================================
  # Job 1: Compilar e rodar testes unitários
  # ============================================
  unit-tests:
    name: Build & Unit Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout do código
        uses: actions/checkout@v4

      - name: Configurar Java 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: 'maven'

      - name: Dar permissão de execução ao Maven Wrapper
        run: chmod +x ./mvnw

      - name: Rodar testes e validar cobertura (JaCoCo ≥ 80%)
        run: ./mvnw clean verify

      - name: Publicar resultado dos testes
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: target/surefire-reports/

  # ============================================
  # Job 2: Análise de código (PMD + SpotBugs + Checkstyle)
  # ============================================
  code-analysis:
    name: Code Analysis (PMD + SpotBugs + Checkstyle)
    runs-on: ubuntu-latest
    needs: unit-tests

    steps:
      - name: Checkout do código
        uses: actions/checkout@v4

      - name: Configurar Java 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: 'maven'

      - name: Dar permissão de execução ao Maven Wrapper
        run: chmod +x ./mvnw

      - name: PMD (code analysis)
        run: ./mvnw pmd:check

      - name: SpotBugs (bug detection)
        run: ./mvnw spotbugs:check

      - name: Checkstyle (style)
        run: ./mvnw checkstyle:check