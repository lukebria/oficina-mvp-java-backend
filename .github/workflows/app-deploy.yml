name: "Oficina App - Pipeline"

on:
  push:
    branches:
      - main
      - master
  pull_request:
    branches:
      - main
      - master
  workflow_dispatch:

jobs:
  # ==========================================
  # 1. JOB DE TESTES (Unitários / Integração)
  # ==========================================
  test:
    name: "1. Run Tests"
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven

      - name: Run Unit Tests
        run: mvn clean test
        
# ==========================================
  # JOB 2: SONARQUBE / SONARCLOUD SCAN
  # Roda a análise estática do código Java
  # ==========================================
  sonarqube:
    name: "2. SonarQube Scan"
    needs: test # Só roda se os testes passarem
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          # Recomendado pelo Sonar para histórico de blame e cobertura precisa
          fetch-depth: 0

      - name: Setup Java 21 JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'
          cache: 'maven'

      - name: Cache SonarQube packages
        uses: actions/cache@v4
        with:
          path: ~/.sonar/cache
          key: ${{ runner.os }}-sonar
          restore-keys: ${{ runner.os }}-sonar

      - name: Run SonarQube Analysis
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: https://sonarcloud.io # Se for o SonarCloud oficial
        run: |
          mvn -B verify sonar:sonar \
            -Dsonar.projectKey=${{ vars.SONAR_PROJECTS }} \
            -Dsonar.organization=${{ vars.SONAR_ORGANIZATION}} \
            -Dsonar.host.url=https://sonarcloud.io
  # ==========================================
  # 2. JOB DE BUILD (Compilação do .jar)
  # ==========================================
  build:
    name: "3. Build Artifact"
    needs: sonarqube # Só roda se o Job 'test' passar!
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven

      - name: Build Package
        run: mvn clean package -DskipTests

  # ==========================================
  # 3. JOB DE PUSH (Build Docker & Push no ECR)
  # ==========================================
  push:
    name: "4. Docker Build & ECR Push"
    needs: build # Só roda se o Job 'build' passar!
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-session-token: ${{ secrets.AWS_SESSION_TOKEN }}
          aws-region: ${{ vars.AWS_DEFAULT_REGION }}

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build, Tag and Push Image to Amazon ECR
        id: build-push
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          ECR_REPOSITORY: oficina-mecnica-lab
          IMAGE_TAG: ${{ github.sha }}
        run: |
          docker build -t $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG -t $ECR_REGISTRY/$ECR_REPOSITORY:latest .
          docker push $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG
          docker push $ECR_REGISTRY/$ECR_REPOSITORY:latest
          echo "ecr_registry=$ECR_REGISTRY" >> "$GITHUB_OUTPUT"

# ==========================================
  # JOB 4: DEPLOY
  # Conecta no EKS e aplica os manifestos Kubernetes
  # ==========================================
  deploy:
    name: 🚀 Deploy to AWS EKS
    runs-on: ubuntu-latest
    needs: push # Só roda se o push no ECR passar

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-session-token: ${{ secrets.AWS_SESSION_TOKEN }}
          aws-region: ${{ vars.AWS_DEFAULT_REGION }}

      - name: Update Kubeconfig for EKS
        run: |
          aws eks update-kubeconfig --name oficina-mecnica-lab-cluster --region ${{ vars.AWS_DEFAULT_REGION }}

      - name: Substitute Secrets and Image URL & Apply K8s Manifests
        env:
          ECR_REGISTRY: ${{ needs.push.outputs.ecr_registry }}
          ECR_REPOSITORY: oficina-mecnica-lab
          # Mapeamento dos GitHub Secrets para variáveis do ambiente de execução
          DB_PASSWORD: ${{ secrets.DB_PASSWORD }}
          JWT_SECRET: ${{ secrets.JWT_SECRET }}
          SEED_ADMIN_PASSWORD: ${{ secrets.SEED_ADMIN_PASSWORD }}
        run: |
          # 1. Substitui os placeholders de Secrets no 01-config-secret.yaml
          envsubst '${DB_PASSWORD} ${JWT_SECRET} ${SEED_ADMIN_PASSWORD}' < k8s/config-secret.yaml > k8s/config-secret.tmp.yaml
          mv k8s/config-secret.tmp.yaml k8s/config-secret.yaml

          # 2. Substitui o placeholder da Imagem Docker no 03-app.yaml
          sed -i "s|\${ECR_REPOSITORY_URL}|$ECR_REGISTRY/$ECR_REPOSITORY|g" k8s/app.yaml

          # 3. Aplica os manifestos no cluster EKS
          kubectl apply -f k8s/config-secret.yaml
          kubectl apply -f k8s/banco.yaml
          kubectl apply -f k8s/app.yaml
          kubectl apply -f k8s/hpa.yaml
